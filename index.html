<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitaal sterk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
/* ===== Digitaal sterk: thema.css =====
   Kleuren en lettertypes van het lab. Het bestand heeft twee delen:
   1. De basis: alle kleurnamen die de motor gebruikt, voor licht en donker, en per pad.
      Laat dit deel staan; zo is elke kleurnaam zeker ingevuld.
   2. De eigen kleuren van dit lab, helemaal onderaan. Pas alleen dat deel aan.

   De belangrijkste kleurnamen
     --bg, --surface, --sunk     achtergrond, kaarten, verzonken vlakken
     --ink, --muted, --line      tekst, bijtekst, randen
     --accent, --accent-ink      knoppen en accenten, en de tekst erop (contrast minstens 4,5:1)
     --mebg                      achtergrond van eigen tekstballonnen
     --stamp, --stamp-ink        beloningszegel en afgevinkte haltes
     --ok, --nok (+ -bg)         juist en fout
     --land, --land2, --water, --route, --tree   kleuren van de kaart
     --c-jong, --c-tiener, --c-hoger              kleur van elk pad op het keuzescherm
     --f-display                 lettertype van titels (moet ook in LAB.lettertypes staan)
   Het pad 15–18 is bewust altijd donker. */
:root{
  /* Layout: smalle app-kolom; de kaart is een metroplan met 8 stations, lessenpaneel ernaast (desktop) of eronder (gsm).
     Eigen tokens per pad: 12–14 vrolijk metroplan, 15–18 nachtstad met neonlijn, volwassenen sober vervoersplan. */
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E6EBF1; --ink:#16202C; --muted:#56657A; --line:#CFD8E3;
  --accent:#C8283A; --accent-ink:#FFFFFF; --mebg:#FBE3E5; --stamp:#F2B632; --stamp-ink:#3A2700;
  --ok:#1C7D52; --ok-bg:#DDF2E7; --nok:#B83B26; --nok-bg:#FBE4DE;
  --p1:#1E8C7E; --p2:#5A4FD0; --p3:#B87410; --p4:#C2417A;
  --land:#F7F8FA; --land2:#E7EBF0; --water:#CDE4F1; --route:#C8283A; --tree:#9CC5A1; --trunk:#8A6A4F;
  --rock:#BDB4A3; --roof:#C8283A; --wall:#FFFFFF; --door:#33415C; --glow:#FFD27A;
  --c-jong:#E2363E; --c-tiener:#00A97A; --c-hoger:#1F5FAD;
  --f-display:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E27; --sunk:#1E2732; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3542;
  --accent:#FF6B78; --accent-ink:#1A0A0C; --mebg:#3A1E23; --stamp:#F2B632; --stamp-ink:#2A1A00;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --p1:#5CC6B8; --p2:#A592FF; --p3:#F0AE3A; --p4:#FF7FB0;
  --land:#121922; --land2:#1C2530; --water:#16303F; --route:#FF6B78; --tree:#3F6F55;
  --wall:#1E2732; --door:#070B12;
  --c-jong:#FF6B70; --c-tiener:#3FE0B0; --c-hoger:#6FA8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --sunk:#1E2732; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3542;
  --accent:#FF6B78; --accent-ink:#1A0A0C; --mebg:#3A1E23; --stamp:#F2B632; --stamp-ink:#2A1A00;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --p1:#5CC6B8; --p2:#A592FF; --p3:#F0AE3A; --p4:#FF7FB0;
  --land:#121922; --land2:#1C2530; --water:#16303F; --route:#FF6B78; --tree:#3F6F55;
  --wall:#1E2732; --door:#070B12;
  --c-jong:#FF6B70; --c-tiener:#3FE0B0; --c-hoger:#6FA8FF; color-scheme:dark }

/* 12–14: vrolijk metroplan */
:root[data-path="jong"]{
  --bg:#FFF7EC; --surface:#FFFFFF; --sunk:#FCEBD4; --ink:#22202B; --muted:#6A6272; --line:#F0D9BC;
  --accent:#E2363E; --accent-ink:#FFFFFF; --mebg:#FFE1DF; --stamp:#FFC23D; --stamp-ink:#3A2500;
  --land:#FFF3E2; --land2:#FCE3C2; --water:#A8DCF2; --route:#E2363E; --tree:#86C98A;
  --f-display:"Rubik", "Avenir Next Rounded", "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark){:root[data-path="jong"]:not([data-theme="light"]){
  --bg:#1A1620; --surface:#241F2C; --sunk:#2E2838; --ink:#F6F0FA; --muted:#B5AAC2; --line:#3A3346;
  --accent:#FF6B70; --accent-ink:#1A0A0B; --mebg:#3C2228;
  --land:#1E1A25; --land2:#2A2433; --water:#1C3A4D; --route:#FF6B70; --tree:#4F8A57; }}
:root[data-path="jong"][data-theme="dark"]{
  --bg:#1A1620; --surface:#241F2C; --sunk:#2E2838; --ink:#F6F0FA; --muted:#B5AAC2; --line:#3A3346;
  --accent:#FF6B70; --accent-ink:#1A0A0B; --mebg:#3C2228;
  --land:#1E1A25; --land2:#2A2433; --water:#1C3A4D; --route:#FF6B70; --tree:#4F8A57; }

/* 15–18: bewust altijd nachtstad met neonlijn */
:root[data-path="tiener"], :root[data-path="tiener"][data-theme]{
  --bg:#0A0E13; --surface:#121921; --sunk:#1A232E; --ink:#E9F2F8; --muted:#8FA3B5; --line:#24303D;
  --accent:#00E5A0; --accent-ink:#03140D; --mebg:#0E3A2D; --stamp:#FF4FD8; --stamp-ink:#2A0423;
  --ok:#5EE0A0; --ok-bg:#123527; --nok:#FF8E78; --nok-bg:#3A1E20;
  --p1:#00E5A0; --p2:#9D8CFF; --p3:#FFC857; --p4:#FF4FD8;
  --land:#0C1218; --land2:#141C25; --water:#0B2636; --route:#00E5A0; --tree:#1F3B36;
  --f-display:"Oxanium", "Bahnschrift", "Segoe UI", system-ui, sans-serif; color-scheme:dark; }


/* ---------- 2. eigen kleuren van Digitaal sterk (overschrijven de basis hierboven) ----------
   Eén pad (hoger onderwijs). Kaart: een campus van bovenaf, met gras, een kronkelend wandelpad, bomen en gebouwen met gekleurde daken.
   Licht: fris groen en petrol. Donker: campus bij avond. */
:root, :root[data-path="hoger"]{
  --bg:#F3F7F6; --surface:#FFFFFF; --sunk:#E4EEEC; --ink:#14282A; --muted:#4F6466; --line:#CBDCD9;
  --accent:#0E6767; --accent-ink:#FFFFFF; --mebg:#DDEFEC; --stamp:#F2B632; --stamp-ink:#2E2100; --route:#0E6767;
  --ok:#1C7D52; --ok-bg:#DDF2E7; --nok:#B83B26; --nok-bg:#FBE4DE;
  --c-hoger:#0E6767;
  --gras:#CFE5C0; --gras2:#E3F0D7; --pad:#F7F1E5; --padrand:#E0D3BC; --gebouw:#FFFFFF; --extern:#FFF5E6; --dak1:#D9735A; --dak2:#2F8A83; --dak3:#EDB04A; --dak4:#6B78C6; --raampje:#D6E6E8; --haag:#86BA72; --stoep:#E4E0D7; --rail:#7B8784; --boom:#68A95B; --campus-ink:#14282A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]), :root[data-path="hoger"]:not([data-theme="light"]){
  --bg:#0F1817; --surface:#162322; --sunk:#1D2D2C; --ink:#E6F1EF; --muted:#9DB3B0; --line:#2A3C3B;
  --accent:#5FD0C4; --accent-ink:#06201D; --mebg:#163733; --route:#5FD0C4;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --c-hoger:#5FD0C4;
  --gras:#13221A; --gras2:#182B20; --pad:#2B3430; --padrand:#1D2521; --gebouw:#1E2B2A; --extern:#2F2A21; --dak1:#C0654D; --dak2:#3A9A91; --dak3:#C9993A; --dak4:#6F7CC4; --raampje:#2C3D3C; --haag:#2C5236; --stoep:#1F2523; --rail:#6E7C79; --boom:#2E5B38; --campus-ink:#E6F1EF; color-scheme:dark }}
:root[data-theme="dark"], :root[data-path="hoger"][data-theme="dark"]{
  --bg:#0F1817; --surface:#162322; --sunk:#1D2D2C; --ink:#E6F1EF; --muted:#9DB3B0; --line:#2A3C3B;
  --accent:#5FD0C4; --accent-ink:#06201D; --mebg:#163733; --route:#5FD0C4;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --c-hoger:#5FD0C4;
  --gras:#13221A; --gras2:#182B20; --pad:#2B3430; --padrand:#1D2521; --gebouw:#1E2B2A; --extern:#2F2A21; --dak1:#C0654D; --dak2:#3A9A91; --dak3:#C9993A; --dak4:#6F7CC4; --raampje:#2C3D3C; --haag:#2C5236; --stoep:#1F2523; --rail:#6E7C79; --boom:#2E5B38; --campus-ink:#E6F1EF; color-scheme:dark }

/* ===== Lab-fabriek: motor.css =====
   Gedeelde opmaak voor elk lab. Kleuren en lettertypes staan NIET hier maar in thema.css van het lab.
   De opmaak van de kaart staat in motor/kaarten/. */

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;transition:background .3s}
.wrap{max-width:660px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.guide{flex:none;display:block;border-radius:50%}

/* kop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 14px 4px 4px;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}

/* tekstballonnen */
.guideRow{display:flex;gap:12px;align-items:flex-start}
.talk{display:grid;gap:8px;min-width:0;flex:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:11px 15px;min-width:0;justify-self:start;max-width:56ch}
.talk .bubble + .bubble{border-radius:18px}
.bubble .who{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--accent);display:block;margin-bottom:1px}
.bubble b{color:var(--accent)}

/* padkeuze */
.hero{padding-block:26px 22px;display:grid;gap:14px}
.crew{display:flex}
.crew svg{border:4px solid var(--bg);margin-right:-14px}
.hero h1{font-size:clamp(2rem,7vw,2.9rem);letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:52ch}
.paths{display:grid;gap:12px}
.path{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);
  border:1.5px solid var(--line);border-left:6px solid var(--pc);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .15s, border-color .15s}
.path:hover{border-color:var(--pc);transform:translateY(-2px)}
.path .txt{display:grid;gap:3px;min-width:0}
.path b{font-size:1.25rem}
.path small{color:var(--muted);font-size:.93rem}
.path .meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pc);font-weight:700}

/* kaart */
.mapHead{display:grid;gap:12px;padding-block:18px 14px}
.meter{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--stamp);border-radius:99px;transition:width .4s}
.world{display:grid;gap:16px;align-items:start}
@media (min-width:820px){ .world{grid-template-columns:minmax(0,1fr) 340px} .panel{position:sticky;top:16px} }
.mapBox{max-width:470px;width:100%;margin:0 auto;min-width:0}
svg.map{width:100%;height:auto;display:block;border-radius:24px;border:1px solid var(--line)}
.f-land{fill:var(--land)} .f-land2{fill:var(--land2)} .f-water{fill:var(--water)} .f-tree{fill:var(--tree)} .f-trunk{fill:var(--trunk)}
.f-rock{fill:var(--rock)} .f-roof{fill:var(--roof)} .f-wall{fill:var(--wall)} .f-door{fill:var(--door)} .f-glow{fill:var(--glow)}
.f-accent{fill:var(--route)} .f-stamp{fill:var(--stamp)} .f-surface{fill:var(--surface)} .f-ink{fill:var(--ink)} .f-muted{fill:var(--muted)}
.s-land2{fill:none;stroke:var(--land2);stroke-width:1.4} .s-line{stroke:var(--line);stroke-width:1} .s-muted{fill:none;stroke:var(--muted);stroke-width:2}
.route{fill:none;stroke:var(--route);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 13}
.routeBase{fill:none;stroke:var(--land2);stroke-width:16;stroke-linecap:round}
.routeGlow{fill:none;stroke:var(--route);stroke-width:8;opacity:.35}
.lm path,.lm rect,.lm circle,.lm polygon,.lm ellipse{stroke:var(--ink);stroke-opacity:.28;stroke-width:1.2;stroke-linejoin:round}
.lm .ns{stroke:none}
.stopG{cursor:pointer;outline:none}
.lm{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.stopG:hover .lm,.stopG.sel .lm{transform:translateY(-3px) scale(1.04)}
.stopG.locked .lm{filter:saturate(.35)}
.selring{fill:none;stroke:var(--route);stroke-width:3;stroke-dasharray:5 6;opacity:0;transition:opacity .2s}
.stopG.sel .selring,.stopG:focus-visible .selring{opacity:1}
.badge circle{fill:var(--surface);stroke:var(--route);stroke-width:2.5}
.badge text{font-family:var(--f-mono);font-weight:600;font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.badge.done circle{fill:var(--stamp);stroke:var(--stamp)} .badge.done text{fill:var(--stamp-ink)}
.stopG.locked .badge circle{stroke:var(--line)}
.lab{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.stopG.locked .lab{fill:var(--muted)}
.pulse{fill:none;stroke:var(--route);stroke-width:3;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){ .pulse{animation:pulse 1.8s ease-out infinite} }
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panelHead{display:flex;gap:12px;align-items:center}
.pnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:600;background:var(--sunk);border:2.5px solid var(--route)}
.pnum.done{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.panel h2{font-size:1.4rem}
.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel .th{color:var(--muted)}
.lessons{display:grid;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer}
.lesson:hover{border-color:var(--accent)}
.lesson .num{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);flex:none;width:2.4em}
.lesson .lt{flex:1;min-width:0;font-weight:700}
.lesson .st{font-size:.8rem;color:var(--muted);white-space:nowrap}
.lesson.done .st{color:var(--ok);font-weight:700}
.lesson.next{border-color:var(--accent);background:var(--mebg)}
.lesson.next .st{color:var(--accent);font-weight:700}
.soon{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;background:var(--bg);border-radius:12px;padding:12px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:grid;gap:10px}
.linkBtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;justify-self:start}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* les */
.lessonBar{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.segs{display:flex;gap:5px;flex:1}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--sunk)}
.segs i.on{background:var(--accent)}
.lessonTitle{margin:16px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.step{display:grid;gap:18px;margin-top:6px}
.step h2{font-size:1.75rem;letter-spacing:-.01em}
.lead{max-width:60ch;color:var(--muted)}
.exHead{display:flex;gap:12px;align-items:center}
.ico{width:46px;height:46px;border-radius:14px;background:var(--mebg);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}

/* chatvenster */
.chatmock{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.cm-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted);font-weight:700}
.cm-head .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.cm-head .pill{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:99px}
.pill.vaag{background:var(--nok-bg);color:var(--nok)} .pill.sterk{background:var(--ok-bg);color:var(--ok)}
.cm-body{display:flex;flex-direction:column;gap:8px;padding:14px}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:.93rem;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--mebg);border-bottom-right-radius:5px;font-family:var(--f-mono);font-size:.86rem;line-height:1.6}
.msg.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:5px}
.msg .who{display:block;font-family:var(--f-body);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.part{border-bottom:3px solid;padding-bottom:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.duo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}

/* oefeningen */
.q{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.qt.mono{font-family:var(--f-mono);font-size:.88rem;background:var(--mebg);border-radius:12px;padding:10px 12px}
.pair{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.nok{background:var(--nok-bg);border-color:var(--nok);color:var(--nok)}

.msg.wide{max-width:100%;width:100%;box-sizing:border-box}

.cert{border:2px solid var(--stamp);border-radius:var(--r);background:var(--surface);padding:24px 18px;display:grid;gap:10px;text-align:center;justify-items:center;box-shadow:inset 0 0 0 6px var(--surface), inset 0 0 0 7px var(--line)}

textarea{width:100%;min-height:130px;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:12px;

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem;font-family:var(--f-display);letter-spacing:.01em;box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 60%, var(--ink))}

@media (prefers-reduced-motion: no-preference){

  .seal{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

}

.gchart .gl{stroke:var(--accent);stroke-width:2.5}
.gchart .gd{fill:var(--accent)}
.gchart .gtag{font-size:10.5px;fill:var(--muted);font-style:italic}
.togRow{display:flex;justify-content:flex-end}
.zoek .opt{align-items:flex-start}
.zr-in{display:grid;gap:2px;text-align:left}
.zr-site{font-size:.78rem;color:var(--ok);font-family:var(--f-mono)}
.zr-titel{font-size:.98rem;color:var(--accent)}
.zr-txt{font-size:.88rem;color:var(--muted)}
.weet a{color:var(--accent);font-weight:600}

/* ---------- smalle schermen: lange webadressen en woorden breken af ---------- */
.bubble,.msg,.lead,.qt,.dtext,.post,.scen,.ph-txt,.card,.opt,.zin,.piece,.slot{overflow-wrap:anywhere}
.q,.qt,.pair,.card,.step{min-width:0}
.qt.mono{word-break:break-word}

/* ---------- oefening: overhoorkaarten ---------- */
.ovh{gap:12px}
.ovh-tel{font-size:.85rem;font-weight:700;color:var(--muted)}
.ovh-kaart{position:relative;min-height:150px;border-radius:14px;padding:30px 18px 18px;display:grid;align-content:center;gap:8px;text-align:center;
  background:var(--bg);border:2px solid var(--line);box-shadow:0 3px 0 var(--line), 0 6px 0 -2px var(--sunk)}
.ovh-kaart.om{background:color-mix(in srgb, var(--accent) 9%, var(--surface));border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.ovh-kaart.klaar{background:var(--ok-bg);border-color:var(--ok);box-shadow:none}
.ovh-kant{position:absolute;top:8px;left:12px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ovh-txt{font-size:1.12rem;font-weight:700;line-height:1.4}
.ovh-vraag{font-size:.86rem;color:var(--muted)}
.ovh-r{display:grid;gap:8px;justify-items:center}
.ovh-oord{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ovh-o.o0{border-color:color-mix(in srgb, var(--ok) 55%, var(--line))}
.ovh-o.o2{border-color:color-mix(in srgb, var(--nok) 55%, var(--line))}
.ovh-terug .lcheck{background:var(--sunk);color:var(--ink)}
@media (prefers-reduced-motion: no-preference){ .ovh-kaart.om{animation:ovhflip .35s ease} }
@keyframes ovhflip{from{transform:perspective(600px) rotateY(80deg)}to{transform:none}}

/* ---------- oefening: weekplanner ---------- */
.pl-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.pl-leg span{display:inline-flex;align-items:center;gap:6px}
.pl-leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.pl-week{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:8px}
@media (min-width:560px){ .pl-week{grid-template-columns:repeat(var(--n), minmax(0,1fr))} }
.pl-dag{display:grid;gap:4px;align-content:start;justify-items:center;text-align:center;min-height:78px;padding:8px 4px;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
button.pl-dag:hover{border-color:var(--accent)}
.pl-dag b{font-size:.82rem}
.pl-dag span{font-size:.78rem;line-height:1.25;font-weight:700;hyphens:auto;overflow-wrap:anywhere}
.pl-dag.vast{cursor:default;background:var(--sunk);border-style:solid;color:var(--muted)}
.pl-dag.toets{cursor:default;border:2px solid var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--surface))}
.pl-leg .b-leren i,.pl-dag.b-leren{background:color-mix(in srgb, var(--p2) 20%, var(--surface));border:1.5px solid var(--p2)}
.pl-leg .b-overhoor i,.pl-dag.b-overhoor{background:color-mix(in srgb, var(--p1) 22%, var(--surface));border:1.5px solid var(--p1)}
.pl-leg .b-vrij i,.pl-dag.b-vrij{background:color-mix(in srgb, var(--p3) 18%, var(--surface));border:1.5px solid var(--p3)}
.pl-hint{margin:0;font-size:.85rem;color:var(--muted)}
.pl-regels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl-regels li{display:flex;gap:10px;align-items:flex-start}
.pl-regels li.nok .lcheck{background:var(--nok-bg);color:var(--nok)}

/* ---------- oefening: zekerheidsmeter ---------- */
.zk-q{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.zk-q:last-of-type{border-bottom:0}
.zk-opts{display:grid;gap:8px}
.zk-opts .opt{text-align:left;font-weight:600}
.opt.kies{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--bg))}
.zk-rij{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zk-lab{font-size:.85rem;font-weight:700;color:var(--muted)}
.zk-zk{display:flex;gap:6px;flex-wrap:wrap}
.zk-z{padding:7px 14px}
.zk-z:disabled:not(.kies){opacity:.55}
.zk-som{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.zk-som span{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;background:var(--sunk)}
.zk-som .ok{background:var(--ok-bg);color:var(--ok)}
.zk-som .nok{background:var(--nok-bg);color:var(--nok)}
.zk-q .qt{font-weight:700;line-height:1.4}

/* ---------- animatie: vergeetcurve ---------- */
.avc-svg{width:100%;height:auto;display:block}
.avc-grid{stroke:var(--line);stroke-width:1}
.avc-y,.avc-x,.avc-h text{font-size:11px;fill:var(--muted)}
.avc-tag,.avc-tag2{font-size:11px;fill:var(--muted);color:var(--muted);font-style:italic}
.avc-tag2{text-align:right;margin-top:6px}
.avc-zonder,.avc-met{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.avc-zonder{stroke:var(--muted);stroke-dasharray:none}
.avc-met{stroke:var(--accent)}
.avc-zonder.teken,.avc-met.teken{transition:stroke-dashoffset 2s ease}
.avc-h line{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:0;transition:opacity .4s}
.avc-h text{fill:var(--accent);font-weight:700;opacity:0;transition:opacity .4s}
.avc-h.on line{opacity:.6}.avc-h.on text{opacity:1}
.avc-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-top:4px}
.avc-leg span{display:inline-flex;align-items:center;gap:6px;transition:opacity .4s}
.avc-leg i{width:18px;height:3px;border-radius:2px;display:inline-block}
.avc-leg .z i{background:var(--muted)}.avc-leg .m i{background:var(--accent)}
/* ---------- animatie: terugplannen ---------- */
.atp{display:grid;grid-template-columns:repeat(var(--n), minmax(0,1fr));gap:6px}
.atp-d{border:1.5px dashed var(--line);border-radius:10px;min-height:76px;padding:6px 3px;display:grid;align-content:start;justify-items:center;gap:4px;text-align:center;background:var(--bg);transition:background .4s, border-color .4s}
.atp-d b{font-size:.78rem}
.atp-d span{font-size:.72rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.atp-d.on{border-style:solid}
@media (prefers-reduced-motion: no-preference){ .atp-d.on{animation:ain .4s ease} }
.atp-p::before{content:"← "}
@media (max-width:480px){ .atp{grid-template-columns:1fr;gap:5px} .atp-d{min-height:0;grid-template-columns:44px 1fr;justify-items:start;text-align:left;align-items:center;padding:7px 10px} .atp-d span{font-size:.85rem} .atp-p::before{content:"↑ "} }
.atp-d.s-toets{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 16%, var(--surface))}
.atp-d.s-leren{border-color:var(--p2);background:color-mix(in srgb, var(--p2) 18%, var(--surface))}
.atp-d.s-overhoor{border-color:var(--p1);background:color-mix(in srgb, var(--p1) 20%, var(--surface))}
.atp-d.s-vrij{border-color:var(--p3);background:color-mix(in srgb, var(--p3) 16%, var(--surface))}
.atp-pijl{margin-top:8px;text-align:right;font-size:.82rem;font-weight:700;color:var(--accent);opacity:0;transition:opacity .5s}
.atp-pijl.on{opacity:1}
/* ---------- animatie: herlezen vs overhoren ---------- */
.ah{display:grid;gap:12px}
@media (min-width:560px){ .ah{grid-template-columns:1fr 1fr} }
.ah-k{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg);transition:border-color .4s}
.ah-k small{color:var(--muted)}
.ah-r{display:grid;gap:4px;font-size:.84rem;color:var(--muted)}
.ah-bar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.ah-bar i{display:block;height:100%;width:0;border-radius:6px;transition:width 1s ease}
.ah-bar.gv i{background:var(--p3)}
.ah-bar.bl i{background:var(--muted)}
.ah-k.win{border-color:var(--ok)} .ah-k.win .ah-bar.bl i{background:var(--ok)}
.ah-k.zwak .ah-bar.bl i{background:var(--nok)}
/* ---------- animatie: woordweb ---------- */
.aw{position:relative;aspect-ratio:360/260;width:100%}
.aw-svg{position:absolute;inset:0;width:100%;height:100%}
.aw-l{stroke:var(--accent);stroke-width:2;opacity:0;stroke-dasharray:4 4;transition:opacity .5s}
.aw-l.on{opacity:.7}
.aw-kern,.aw-tak{position:absolute;transform:translate(-50%,-50%);border-radius:999px;padding:6px 12px;font-weight:700;text-align:center;line-height:1.2}
.aw-kern{background:var(--accent);color:var(--accent-ink);font-size:1rem;max-width:42%}
.aw-tak{background:var(--surface);border:1.5px solid var(--line);font-size:.8rem;width:max-content;max-width:30%;opacity:0;scale:.6;transition:opacity .45s, scale .45s}
.aw-tak.on{opacity:1;scale:1;border-color:var(--accent)}
/* ---------- animatie: focus ---------- */
.afo{display:grid;gap:12px;position:relative}
.afo > .afo-ping{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:2;width:max-content;max-width:92%}
.afo-r{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);transition:border-color .4s}
.afo-r.win{border-color:var(--ok)}
.afo-kop{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;flex-wrap:wrap}
.afo-tijd{color:var(--muted);font-weight:700}
.afo-r.win .afo-tijd{color:var(--ok)}
.afo-bar{display:flex;height:16px;border-radius:8px;background:var(--sunk);overflow:hidden;gap:2px}
.afo-s{display:block;height:100%;background:var(--p2);transition:width .6s ease}
.afo-s.weg{background:repeating-linear-gradient(45deg, var(--nok) 0 4px, transparent 4px 8px)}
.afo-s.vol{background:var(--ok)}
.afo-ping{justify-self:center;display:flex;gap:8px;align-items:center;border-radius:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.14);font-size:.86rem;opacity:0;transform:translateY(-6px);transition:opacity .3s, transform .3s;max-width:100%}
.afo-ping.on{opacity:1;transform:none}
.afo-app{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
/* ---------- animatie: gevoel vs test ---------- */
.agv{display:grid;gap:6px}
.agv-r{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);opacity:.45;transition:opacity .4s, border-color .4s, background .4s}
.agv-r.on{opacity:1}
.agv-kop{opacity:1;background:none;border:0;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 10px}
.agv-g{font-size:.84rem;font-weight:700;color:var(--muted)}
.agv-t{font-weight:800;text-align:center}
.agv-t.ok{color:var(--ok)}.agv-t.nok{color:var(--nok)}
.agv-r.blind{border-color:var(--nok);background:var(--nok-bg)}
.agv-r.blind::after{content:"Blinde vlek: zeker gevoeld, maar fout";grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--nok)}
h1,h2,h3,.opt,.qt{overflow-wrap:break-word}

.pl-u{color:var(--muted);font-size:.86rem}

/* ---------- oefening: eindtoets met drempel ---------- */
.toets{display:grid;gap:16px}
.tq{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tq .qt{font-weight:700;line-height:1.4}
.tqnr{color:var(--muted)}
.tq .mc .opt{text-align:left}
.tqf{margin:0;font-size:.9rem;line-height:1.45;color:var(--muted)}
.tqf.ok b{color:var(--ok)} .tqf.nok b{color:var(--nok)}
/* ---------- oefening: maskeren ---------- */
.mk-doc,.amk-doc{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px}
.mk-kop{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mk-tekst{margin:0;line-height:2.05}
.mw{font:inherit;color:inherit;background:none;border:0;border-bottom:1.5px dotted var(--line);padding:1px 2px;margin:0;border-radius:4px;cursor:pointer;line-height:1.5}
.mw:hover{background:var(--sunk)}
.mw.gekozen{background:#1f1f1f;color:#fff;border-bottom-color:transparent}
.mw.ok{background:var(--ok-bg);color:var(--ok);outline:1.5px solid var(--ok)}
.mw.gemist{outline:2px solid var(--nok);background:var(--nok-bg);color:var(--nok)}
.mw.teveel{text-decoration:line-through;background:var(--sunk);color:var(--muted)}
.mw:disabled{cursor:default}
.mk-veilig{border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;line-height:1.7;background:color-mix(in srgb, var(--accent) 6%, var(--surface))}
.mk-lab,.amk-s.lab{display:inline-block;font-family:var(--f-mono, ui-monospace, monospace);font-size:.82em;font-weight:700;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
/* ---------- animatie: maskeren ---------- */
.amk{display:grid;gap:12px}
.amk-tekst{margin:0;line-height:1.9}
.amk-s{border-radius:5px;padding:0 2px;transition:background .3s, color .3s}
.amk-s.spot{background:color-mix(in srgb, var(--nok) 22%, transparent);outline:1.5px solid var(--nok)}
.amk-doc{transition:transform .6s ease, border-color .4s}
.amk-doc.veilig{border-color:var(--ok)}
.amk-tool{justify-self:center;display:flex;gap:8px;align-items:center;border-radius:999px;padding:8px 16px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem;transition:all .4s}
.amk-tool.on{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.amk-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
/* ---------- attest ---------- */
.attestWrap{display:grid;gap:16px}
.attest{background:#fff;color:#1b1b1f;border:1px solid #d9d9de;border-radius:14px;padding:26px 24px;display:grid;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);font-family:var(--f-body, system-ui, sans-serif)}
.atTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:#55555f;border-bottom:3px solid var(--accent-print, #1f5fbf);padding-bottom:10px}
.atBrand{font-weight:800;letter-spacing:.08em}
.atLab{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.atLab svg{width:20px;height:20px;color:var(--accent-print, #1f5fbf)}
.atTitel{margin:8px 0 0;font-family:var(--f-display);font-size:1.5rem;line-height:1.2;color:#14141a}
.atLead{margin:0;color:#3d3d46;line-height:1.5}
.atNaam{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:#14141a;border-bottom:1px solid #d9d9de;padding:4px 0 6px}
.atData{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:6px 0 0;font-size:.92rem}
.atData dt{color:#6a6a74}
.atData dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.atKop{font-weight:800;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:#55555f;margin-top:8px}
.atOnd{margin:0;padding-left:20px;display:grid;gap:2px;font-size:.92rem}
.atVoet{margin:8px 0 0;font-size:.78rem;line-height:1.45;color:#6a6a74;border-top:1px solid #e6e6ea;padding-top:10px}
.atActies{display:grid;gap:10px}
.certName.leeg{outline:2px solid var(--nok)}
#printAttest{display:none}
@media print{
  body.printing > *:not(#printAttest){display:none !important}
  body.printing #printAttest{display:block}
  body.printing{background:#fff !important}
  #printAttest .attest{box-shadow:none;border:0;padding:0;max-width:none}
  @page{size:A4;margin:18mm}
}
/* ---------- voortgangscode ---------- */
.codeInfo{display:grid;gap:6px}
.codeInfo ul{margin:0;padding-left:20px}
.codeInfo p{margin:0}
.codeVak{width:100%;font-family:var(--f-mono, ui-monospace, monospace);font-size:.85rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);overflow-wrap:anywhere;resize:vertical}
.exHead > div{min-width:0}

/* voorlezen (PATHS.<pad>.voorlezen) */
.leesvoor{display:inline-flex;align-items:center;gap:8px;justify-self:start;border:1.5px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 16px 6px 10px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--ink)}
.leesvoor .lv-i{display:flex}
.leesvoor svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.leesvoor:hover,.leesvoor.aan{border-color:var(--accent);color:var(--accent)}
/* toegankelijke weergave (PATHS.<pad>.toegankelijk) */
html[data-toeg] body{font-size:20px;line-height:1.7}
html[data-toeg] .bubble{max-width:44ch;padding:14px 18px}
html[data-toeg] .step{gap:24px}
html[data-toeg] .opt{padding:14px 20px;min-height:52px}
html[data-toeg] .mc .opt{padding:16px}
html[data-toeg] .btn{padding:16px 26px;font-size:1.1rem}
html[data-toeg] .leesvoor{font-size:1rem;padding:9px 18px 9px 12px}
html[data-toeg] .leesvoor svg{width:24px;height:24px}
/* zoekbalk bij de oefenvorm zoek met een zoekvraag (ex.zoekvraag) */
.zoekbalk{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700}
.zoekbalk .zb-i{display:flex;color:var(--muted)}
.zoekbalk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.zr-ad{display:inline-block;font-family:var(--f-body);font-weight:700;font-size:.72rem;color:var(--ink);background:var(--stamp);border-radius:4px;padding:0 6px;margin-right:6px}

/* kaart: campus (van bovenaf). Eigen kleuren via --gras, --gras2, --pad, --padrand, --gebouw, --extern, --dak1 tot --dak4,
   --raampje, --haag, --stoep, --rail, --boom, --campus-ink in thema.css */
svg.campus .gras{fill:var(--gras, var(--land))}
svg.campus .grasVlek{fill:var(--gras2, var(--land2));opacity:.55}
svg.campus .haag{fill:none;stroke:var(--haag, var(--tree));stroke-width:7;opacity:.9}
svg.campus .haagIn{fill:none;stroke:var(--haag, var(--tree));stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
svg.campus .stoep{fill:var(--stoep, var(--sunk))}
svg.campus .rail{stroke:var(--rail, var(--muted));stroke-width:2}
svg.campus .dwars{stroke:var(--rail, var(--muted));stroke-width:2;opacity:.4}
svg.campus .boom{fill:var(--boom, var(--tree))}
svg.campus .boomTop{fill:#FFFFFF;opacity:.2}
svg.campus .boomSchaduw{fill:#000000;opacity:.08}
svg.campus .padRand{fill:none;stroke:var(--padrand, var(--line));stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
svg.campus .pad{fill:none;stroke:var(--pad, var(--land2));stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
svg.campus .route{fill:none;stroke:var(--route);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 8;opacity:.55}
svg.campus .routeAf{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round}
svg.campus .wegje{stroke:var(--pad, var(--land2));stroke-width:12;stroke-linecap:round}
svg.campus .poortPaal{fill:var(--campus-ink, var(--ink));opacity:.7}
svg.campus .start{font-family:var(--f-display);font-weight:700;font-size:12px;fill:var(--campus-ink, var(--ink))}

/* ---------- attestnummer en voortgangscode (gedeeld door het lab en de werkgeverspagina) ----------
   Geen server: de medewerker maakt een code, de werkgever plakt ze in zijn pagina.
   Het controlecijfer vangt tikfouten en eenvoudige aanpassingen op. Fraudebestendig is het niet. */
const CODE = {
  prefix: ((typeof LAB !== 'undefined' && LAB.codePrefix) || 'LAB1') + '.',
  hash(s){ let h = 2166136261 >>> 0; for(const ch of String(s)){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; },
  kort(s, n = 3){ return (CODE.hash(s) % Math.pow(36, n)).toString(36).toUpperCase().padStart(n, '0'); },
  normNaam(n){ return String(n || '').trim().replace(/\s+/g, ' ').toLowerCase(); },
  attestNr(lic, naam, iso){ const d = String(iso).slice(0, 10).replace(/-/g, ''); return `${lic}-${d}-${CODE.kort(lic + '|' + CODE.normNaam(naam) + '|' + d)}`; },
  attestKlopt(nr, lic, naam){ const m = String(nr || '').match(/-(\d{8})-([0-9A-Z]{3})$/); if(!m) return false;
    const iso = `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}`; return CODE.attestNr(lic, naam, iso) === nr; },
  b64e(str){ const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  b64d(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '=';
    const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); },
  maak(obj){ const b = CODE.b64e(JSON.stringify(obj)); return `${CODE.prefix}${b}.${CODE.kort(b, 4)}`; },
  lees(code){
    code = String(code || '').replace(/\s+/g, '');
    if(!code.startsWith(CODE.prefix)) throw new Error('Dit is geen voortgangscode van dit leerpad.');
    const rest = code.slice(CODE.prefix.length), i = rest.lastIndexOf('.');
    if(i < 1) throw new Error('De code is onvolledig.');
    const b = rest.slice(0, i), c = rest.slice(i + 1);
    if(CODE.kort(b, 4) !== c) throw new Error('De code klopt niet: misschien is ze niet volledig gekopieerd of aangepast.');
    return JSON.parse(CODE.b64d(b));
  }
};

function kaleTekst(html){ const d = document.createElement('div'); d.innerHTML = String(html||''); return d.textContent.replace(/\s+/g,' ').trim(); }

/* ---------- kaart ---------- */
const ICONS = LAB.iconen;
/* ---------- kaart: campus ----------
   Een hogeschoolcampus van bovenaf: een kronkelend wandelpad van de poort onderaan naar boven,
   met om beurten links en rechts een gebouw per halte. Werkt voor 4 tot 10 haltes.
   De haltes liggen als genummerde stippen op het pad; het afgelegde stuk van het pad kleurt mee.
   Optioneel: LAB.kaartRuimtes = ['Onthaal', 'Leslokaal', ...] zet de naam van het gebouw boven de halte.
   Optioneel: LAB.kaartBuiten = [9] zet die haltes (nummers vanaf 1) buiten de haag van de campus,
   op de stoep naast de tramsporen, bijvoorbeeld een halte op de werkplek. Bovenaan staat LAB.kaartNaam. */
const CP = (() => {
  const n = AREAS.length, onder = 652, boven = 122, sp = (onder - boven) / Math.max(n - 1, 1);
  const xL = 156, xR = 244, bh = Math.min(100, 2 * sp - 28), bw = 132;
  const buiten = new Set(((typeof LAB !== 'undefined' && LAB.kaartBuiten) || []).map(x => x - 1));
  const stops = AREAS.map((_, i) => {
    const links = i % 2 === 0, uit = buiten.has(i), y = onder - i * sp, px = links ? xL : xR;
    const bx = links ? (uit ? 30 : 14) : 400 - 14 - bw, w = uit && links ? bw - 16 : (uit ? bw - 16 : bw);
    return {i, links, uit, y, px, bx: !links && uit ? 400 - 30 - w : bx, by: y - bh / 2, bw: w, bh};
  });
  return {n, sp, bh, stops, buiten};
})();
const STOPS = CP.stops.map(k => [k.px, k.y]);
function campusLijnen(naam){
  if(naam.length <= 15) return [naam];
  const w = naam.split(' '); let a = '', i = 0;
  while(i < w.length && (a + ' ' + w[i]).trim().length <= 15){ a = (a + ' ' + w[i]).trim(); i++; }
  if(!a){ a = w[0]; i = 1; }
  return [a, w.slice(i).join(' ')];
}
/* het pad als vloeiende lijn door de haltes, vanaf de poort */
function campusPad(tot){
  const pts = [[200, 750], [200, 706], ...CP.stops.map(k => [k.px, k.y])];
  const eind = tot === undefined ? pts.length - 1 : Math.min(tot + 2, pts.length - 1);
  let d = `M${pts[0][0]} ${pts[0][1]} L${pts[1][0]} ${pts[1][1]}`;
  for(let j = 2; j <= eind; j++){
    const [x0, y0] = pts[j-1], [x1, y1] = pts[j], my = (y0 + y1) / 2;
    d += ` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`;
  }
  return d;
}
function mapMarkup(sel){
  const p = S.path, ca = currentArea();
  const bord = LAB.kaartNaam || LAB.naam;
  const ks = CP.stops;
  let s = `<svg class="map campus b-${p}" viewBox="0 0 400 760" role="group" aria-label="Plattegrond van de campus van ${LAB.naam} met ${AREAS.length} gebouwen">
    <rect class="gras" width="400" height="760" rx="14"/>`;
  /* lichte vlekken in het gras */
  [[60,700,46],[340,690,40],[300,420,34],[90,300,38],[320,170,30],[200,60,60]].forEach(([x,y,r]) => { s += `<circle class="grasVlek" cx="${x}" cy="${y}" r="${r}"/>`; });
  /* buiten de campus: stoep met tramsporen langs de buitenkant */
  ks.filter(k => k.uit).forEach(k => {
    const x0 = k.links ? 0 : 400 - 150, y0 = k.by - 16, h = k.bh + 32;
    s += `<rect class="stoep" x="${x0}" y="${y0}" width="150" height="${h}" rx="${k.links ? 0 : 0}"/>`;
    const rx = k.links ? 9 : 400 - 21;
    for(let y = y0 + 4; y < y0 + h; y += 8) s += `<line class="dwars" x1="${rx-3}" y1="${y}" x2="${rx+15}" y2="${y}"/>`;
    s += `<line class="rail" x1="${rx}" y1="${y0}" x2="${rx}" y2="${y0+h}"/><line class="rail" x1="${rx+12}" y1="${y0}" x2="${rx+12}" y2="${y0+h}"/>`;
  });
  /* de haag rond de campus, met een opening voor de poort en voor elke buitenhalte */
  s += `<rect class="haag" x="6" y="52" width="388" height="694" rx="16"/>`;
  ks.filter(k => k.uit).forEach(k => {
    const gx = k.links ? 150 : 250, y0 = k.by - 16, y1 = k.by + k.bh + 16;
    s += `<path class="haagIn" d="M${k.links ? 0 : 400} ${y0} H${gx} V${k.y - 12} M${gx} ${k.y + 12} V${y1} H${k.links ? 0 : 400}"/>`;
  });
  /* bomen en struiken op vrije plekken: tussen de gebouwen aan dezelfde kant */
  const boom = (x, y, r) => { s += `<circle class="boomSchaduw" cx="${x+2}" cy="${y+3}" r="${r}"/><circle class="boom" cx="${x}" cy="${y}" r="${r}"/><circle class="boomTop" cx="${x - r*0.3}" cy="${y - r*0.3}" r="${r*0.45}"/>`; };
  ks.forEach((k, i) => {
    const volgende = ks[i + 2];
    const gy = volgende ? (k.by + volgende.by + volgende.bh) / 2 : k.by - 22;
    if(gy > 70 && CP.sp * 2 - CP.bh >= 24 && !k.uit && !(volgende && volgende.uit)){
      const bx = k.links ? 36 : 364;
      boom(bx, gy, 8); boom(bx + (k.links ? 24 : -24), gy + 1, 6); boom(bx + (k.links ? 46 : -46), gy - 1, 4.5);
    }
  });
  /* het pad: eerst de rand, dan het pad, dan de route (afgelegd stuk in kleur) */
  const heel = campusPad();
  const af = AREAS.findIndex((a, i) => !(a.open && areaFull(i)));
  const tot = af === -1 ? CP.n - 1 : af;
  s += `<path class="padRand" d="${heel}"/><path class="pad" d="${heel}"/><path class="route" d="${heel}"/>`;
  s += `<path class="routeAf" d="${campusPad(tot)}"/>`;
  /* de poort onderaan */
  s += `<rect class="poortPaal" x="178" y="734" width="8" height="16" rx="2"/><rect class="poortPaal" x="214" y="734" width="8" height="16" rx="2"/>
    <text class="start" x="230" y="748" text-anchor="start">Ingang</text>`;
  /* het bord met de naam van de campus */
  s += `<rect class="bordje" x="80" y="14" width="240" height="30" rx="15"/>
    <text class="bordTxt" x="200" y="34" text-anchor="middle">${bord.length > 30 ? bord.slice(0, 29) + '…' : bord}</text>`;
  /* gebouwen en haltes */
  AREAS.forEach((a, i) => {
    const k = ks[i], isFull = a.open && areaFull(i), here = i === ca && !isFull, ls = campusLijnen(a.naam);
    const gebouwNaam = LAB.kaartRuimtes && LAB.kaartRuimtes[i];
    const {bx, by, bw, bh} = k, deurX = k.links ? bx + bw : bx;
    const tx = bx + 12;
    /* ramen onderaan het gebouw */
    let ramen = '';
    const nR = Math.floor((bw - 50) / 16);
    for(let r = 0; r < nR; r++) ramen += `<rect class="raampje" x="${bx + 12 + r*16}" y="${by + bh - 18}" width="9" height="8" rx="1.5"/>`;
    s += `<g class="stopG${a.open?'':' locked'}${i===sel?' sel':''}" data-area="${i}" tabindex="0" role="button" aria-label="Halte ${i+1}: ${a.naam}${gebouwNaam ? ' ('+gebouwNaam+')' : ''}${k.uit ? ', buiten de campus' : ''}${a.open?'':', binnenkort'}">
      <path class="wegje" d="M${deurX} ${k.y} L${k.px} ${k.y}"/>
      <rect class="selring" x="${bx-5}" y="${by-5}" width="${bw+10}" height="${bh+10}" rx="12"/>
      <rect class="schaduw" x="${bx+3}" y="${by+4}" width="${bw}" height="${bh}" rx="9"/>
      <rect class="gebouw${k.uit ? ' extern' : ''}" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="9"/>
      <path class="dak d${i % 4}" d="M${bx} ${by+9} Q${bx} ${by} ${bx+9} ${by} H${bx+bw-9} Q${bx+bw} ${by} ${bx+bw} ${by+9} V${by+14} H${bx} Z"/>
      ${ramen}
      <g transform="translate(${bx+bw-29} ${by+bh-26}) scale(.8)" class="stIcon">${ICONS[i]}</g>
      ${gebouwNaam ? `<text class="gebouwNaam" x="${tx}" y="${by + 31}">${gebouwNaam.toUpperCase()}</text>` : ''}
      <text class="lab" x="${tx}" y="${by + 50}">${ls[0]}</text>
      ${ls[1] ? `<text class="lab" x="${tx}" y="${by + 66}">${ls[1]}</text>` : ''}
      ${here ? `<circle class="pulse" cx="${k.px}" cy="${k.y}" r="17"/><circle class="here" cx="${k.px}" cy="${k.y}" r="17"/><g transform="translate(${k.px-15} ${k.y-15})">${guideMarkup(p,'happy',30)}</g>`
             : `<g class="badge station${isFull?' done':''}" transform="translate(${k.px} ${k.y})"><circle r="13"/><text y="0.5">${isFull?'✓':i+1}</text></g>`}
    </g>`;
  });
  return s + '</svg>';
}

function totaalMinuten(ls){ return (ls||L).reduce((s,l)=>s+(parseInt(l.duur)||0),0); }
function kerncijfers(){
  /* zonder gekozen pad: het pad met de meeste lessen (paden kunnen extra lessen hebben) */
  const per = S.path ? [L] : Object.keys(PATHS).map(lessenVoor), n = per.map(ls=>ls.length);
  const min = Math.max(...per.map(totaalMinuten)), uur = Math.round(min/30)/2;
  const nTekst = Math.min(...n)===Math.max(...n) ? String(n[0]) : `${Math.min(...n)}–${Math.max(...n)}`;
  const tegels = [[AREAS.length,'haltes'],[nTekst,'korte lessen'],[W.aantal==='gidsen' ? new Set(Object.values(PATHS).map(p=>p.gids)).size : Object.keys(PATHS).length, W.aantal],[`± ${String(uur).replace('.',',')} uur`,'in totaal']];
  if(S.path) tegels.splice(2, 1);   /* op een padpagina telt het aantal gidsen niet */
  return h('div',{class:'stats'+(S.path?' drie':'')}, tegels
    .map(([g,t])=>h('div',{class:'stat'}, h('b',null,String(g)), h('span',null,t))));

/* INFO.paden.<pad> overschrijft onderdelen van INFO op de pagina van dat pad (bv. hoeSub, hoe, routeSub, weetjes, extra:null).
   Stappen over het kiezen van een gids (keuze:true, of een titel die met "Kies je" begint) vallen weg op een padpagina. */

}

const ANIMS = {};
function animFig(a){
  const maker = ANIMS[a.soort]; if(!maker) return null;
  const rustig = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const stage = h('div',{class:'astage', 'aria-live':'polite'});
  const knop = h('button',{class:'btn ghost aknop'}, rustig ? '▶ Speel af' : '↻ Opnieuw afspelen');
  let run = 0;
  const play = instant => {
    const id = ++run;
    const T = (ms, fn) => { if(instant) return fn(); setTimeout(()=>{ if(id===run && stage.isConnected) fn(); }, ms); };
    stage.replaceChildren(); maker(stage, a, T, instant);
  };
  knop.addEventListener('click', ()=>{ knop.textContent='↻ Opnieuw afspelen'; play(false); });
  const fig = h('figure',{class:'anim'},
    h('div',{class:'ahead'}, h('span',{class:'atag'}, '▶ Animatie'), h('b',null, a.titel)),
    stage,
    h('figcaption',null, h('span',{html:a.onder||''}), knop));
  if(rustig){ play(true); }
  else if('IntersectionObserver' in window){
    play(true);
    const io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ io.disconnect(); play(false); } }, {threshold:.45});
    setTimeout(()=>io.observe(fig), 50);
  } else play(false);
  return fig;
}

  const st1 = mooi((max-lo)*1.12/4), hi = lo + 4*st1, st2 = mooi(max*1.08/4), hiE = 4*st2;
  const nl = (v, stp) => { const d = stp===undefined ? 2 : stp>=1 ? 0 : stp>=0.1 ? 1 : 2; return String(+(v.toFixed(d))).replace('.', ','); };

/* Vergeetcurve: zonder herhalen zakt wat je onthoudt snel; elke herhaling tilt het weer op en het zakt trager */
ANIMS.vergeet = (st, a, T) => {
  const D = a.dagen || 14, W = 360, H = 210, x0 = 40, y0 = 26, wB = W - x0 - 16, hB = H - y0 - 50;
  const X = d => x0 + d/D*wB, Y = p => y0 + hB - p/100*hB;
  const zonder = [], met = [];
  for(let d = 0; d <= D; d += .25) zonder.push([d, 100*Math.exp(-d/1.6)]);
  const hh = (a.herhaal || [1,3,7]).slice().sort((p,q)=>p-q); let s = 1.6, t0 = 0;
  for(let d = 0; d <= D + 1e-9; d += .25){
    const nh = hh.find(x => Math.abs(x - d) < 1e-9);
    if(nh !== undefined){ met.push([d, 100*Math.exp(-(d-t0)/s)]); t0 = d; s *= 2.6; }
    met.push([d, 100*Math.exp(-(d-t0)/s)]);
  }
  const pad = pts => pts.map(([d,p],i)=>(i?'L':'M')+X(d).toFixed(1)+' '+Y(p).toFixed(1)).join(' ');
  let g = `<svg viewBox="0 0 ${W} ${H}" class="avc-svg" role="img" aria-label="${a.titel}">`;
  [0,50,100].forEach(p=>{ g += `<line class="avc-grid" x1="${x0}" x2="${W-16}" y1="${Y(p)}" y2="${Y(p)}"/><text class="avc-y" x="${x0-6}" y="${Y(p)+4}" text-anchor="end">${p}%</text>`; });
  for(let d = 0; d <= D; d += (D>10?7:1)) g += `<text class="avc-x" x="${X(d)}" y="${y0+hB+16}" text-anchor="${d===0?'start':d>=D?'end':'middle'}">${a.eenheid==='uur'?d+' u':'dag '+d}</text>`;
  g += `<line class="avc-grid" x1="${x0}" x2="${W-16}" y1="${y0+hB}" y2="${y0+hB}"/>`;
  hh.forEach(d=>{ g += `<g class="avc-h" data-d="${d}"><line x1="${X(d)}" x2="${X(d)}" y1="${y0}" y2="${y0+hB}"/><text x="${X(d)}" y="${y0-8}" text-anchor="middle">↻ ${d}</text></g>`; });
  g += `<path class="avc-zonder" d="${pad(zonder)}"/><path class="avc-met" d="${pad(met)}"/>`;
  g += `<text class="avc-tag" x="${W-16}" y="${H-6}" text-anchor="end">ter illustratie</text></svg>`;
  const box = h('div',{class:'avc', html:g});
  const leg = h('div',{class:'avc-leg'}, h('span',{class:'z'}, h('i'), a.labZonder || 'Eén keer geleerd'), h('span',{class:'m'}, h('i'), a.labMet || 'Met herhalen'));
  st.append(box, leg);
  const pz = box.querySelector('.avc-zonder'), pm = box.querySelector('.avc-met');
  [pz, pm].forEach(p=>{ const L = p.getTotalLength ? p.getTotalLength() : 600; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  leg.children[1].style.opacity = '0';
  T(500, ()=>{ pz.classList.add('teken'); pz.style.strokeDashoffset = 0; });
  T(2600, ()=>{ pm.classList.add('teken'); pm.style.strokeDashoffset = 0; leg.children[1].style.opacity = '1'; box.querySelectorAll('.avc-h').forEach(x=>x.classList.add('on')); });
  eindBox(st, a, T, 5200);
};

function grafiekSvg(g, eerlijk){
  const W=360, H=230, x0=46, y0=24, wB=W-x0-14, hB=H-y0-44;
  const vals = g.punten.map(p=>p.v), max = Math.max(...vals), lo = eerlijk ? 0 : g.vanaf;
  const mooi = x => { const e = Math.pow(10, Math.floor(Math.log10(x))); for(const m of [1,2,2.5,5,10]) if(m*e >= x-1e-9) return m*e; };
  const st = mooi((max - lo)*1.15/4), hi = lo + 4*st;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${g.titelGrafiek}">`;
  s += `<text x="${x0}" y="14" class="gt">${g.titelGrafiek}</text>`;
  for(let k=0;k<=4;k++){ const v = lo + (hi-lo)*k/4, y = Y(v); s += `<line x1="${x0}" x2="${W-14}" y1="${y}" y2="${y}" class="gg"/><text x="${x0-6}" y="${y+4}" class="gy" text-anchor="end">${nl(Math.round(v*100)/100)}${g.eenheid||''}</text>`; }
  g.punten.forEach((p,i)=>{ const cx = x0 + wB/n*(i+.5);
    if(g.soort==='lijn'){ if(i>0){ const q=g.punten[i-1], px=x0+wB/n*(i-.5); s+=`<line x1="${px}" y1="${Y(q.v)}" x2="${cx}" y2="${Y(p.v)}" class="gl"/>`; } s+=`<circle cx="${cx}" cy="${Y(p.v)}" r="4.5" class="gd"/>`; }
    else s += `<rect x="${cx-bw/2}" y="${Y(p.v)}" width="${bw}" height="${y0+hB-Y(p.v)}" rx="3" class="gb"/>`;
    s += `<text x="${cx}" y="${Y(p.v)-7}" text-anchor="middle" class="gv">${nl(p.v)}${g.eenheid||''}</text><text x="${cx}" y="${y0+hB+18}" text-anchor="middle" class="gx">${p.l}</text>`; });
  s += `<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y0+hB}" class="ga"/><line x1="${x0}" x2="${W-14}" y1="${y0+hB}" y2="${y0+hB}" class="ga"/>`;
  s += `<text x="${W-14}" y="${H-6}" text-anchor="end" class="gtag">${eerlijk ? 'Eerlijke versie: de as begint bij 0' : (g.tag||'Zoals de grafiek rondging')}</text></svg>`;
  return s;
}

function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  if(e.type==='deel'){ e.knoppen = ex.knoppen || ['Delen','Eerst checken','Niet delen']; e.items = shuf(ex.items); }
  if(e.type==='echtnep') e.zinnen = [ ...(ex.van?[{t:(ex.kanaal==='mail'?'Van: ':'')+ex.van, fout:!!ex.vanVlag, u:ex.vanU, kop:'mm-from'}]:[]),
                                     ...(ex.onderwerp?[{t:'Onderwerp: '+ex.onderwerp, fout:!!ex.onderwerpVlag, u:ex.onderwerpU, kop:'mm-subj'}]:[]),
                                     ...ex.zinnen ];

    e.items = shuf(ex.items.map(it=>Object.assign({}, it, {a: perm.indexOf(it.a)})));
  }

    h('div',{class:'certTop'}, flask(), LAB.naam),
    h('h3',null,p.cert.titel), naamOut, h('p',{class:'certSub'}, p.cert.sub),
    h('ul',{class:'certSkills'}, SKILLS.map((s,i)=>h('li',{class:areaFull(i)?'on':''}, h('span',{'aria-hidden':'true'}, areaFull(i)?'✓':'·'), s))),
    h('div',{class:'certFoot'}, h('span',null, tot ? `${goed}/${tot} meteen juist` : ''), h('span',null, datum.toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'}))),
    h('div',{class:'certForm'}, h('label',{for:'cert-naam'}, 'Naam op het certificaat'), naamIn),
    h('p',{class:'certHint'}, 'Bewaren? Maak een schermafbeelding.'));
}
function renderCert(){
  setPath(S.path); app.className='wrap';
  app.replaceChildren(
    h('div',{class:'lessonBar'}, h('button',{class:'x','aria-label':'Terug naar de kaart', onclick:()=>{ selArea=AREAS.length-1; renderMap(); toTop(); }}, '✕'), h('div',{class:'kicker'},'Eindproef')),
    h('div',{class:'step', style:'margin-top:16px'}, h('h2',null,PATHS[S.path].cert.titel), LAB.attest ? attestCard() : certCard()));
}


/* ---------- attest, voortgangscode (labs met LAB.attest en LAB.werkgever) ---------- */
function vandaag(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function datumNL(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'}); }
function halteDatum(i){
  if(!areaFull(i)) return '';
  const dd = (S.datum&&S.datum[S.path])||{};
  const ds = lessonsOf(i).map(l=>dd[l.id]).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : '?';
}
function klaarDatum(){ const d=(S.datum&&S.datum[S.path])||{}; return d[L[L.length-1].id] || ((S.klaar&&S.klaar[S.path])||'').slice(0,10) || vandaag(); }
function attestNummer(){ return S.naam && S.naam.trim() ? CODE.attestNr(LIC.nummer||'DEMO', S.naam, klaarDatum()) : ''; }
function naamVeld(label, opWijzig){
  const inp = h('input',{class:'certName', type:'text', maxlength:'60', placeholder:'Typ je voor- en achternaam', autocomplete:'name'});
  inp.value = S.naam||'';
  inp.addEventListener('input',()=>{ S.naam=inp.value; save(); opWijzig && opWijzig(); });
  const id = 'naam-'+Math.random().toString(36).slice(2,7); inp.id = id;
  return h('div',{class:'certForm'}, h('label',{for:id}, label), inp);
}
function attestCard(){
  const A = LAB.attest, p = PATHS[S.path], iso = klaarDatum();
  const naamOut = h('div',{class:'atNaam'}, S.naam||'Jouw naam');
  const nrOut = h('dd',{class:'atNr'});
  const zet = () => { naamOut.textContent = S.naam||'Jouw naam'; nrOut.textContent = attestNummer() || 'verschijnt als je je naam invult'; };
  const rij = (k, v) => [h('dt',null,k), typeof v==='string' ? h('dd',null,v) : v];
  const doc = h('div',{class:'attest'},
    h('div',{class:'atTop'}, h('span',{class:'atBrand'}, A.aanbieder||''), h('span',{class:'atLab'}, flask(), LAB.naam)),
    h('h3',{class:'atTitel'}, A.titel),
    h('p',{class:'atLead'}, 'Hierbij bevestigen we dat'),
    naamOut,
    h('p',{class:'atLead'}, (LIC.organisatie ? `van ${LIC.organisatie} ` : '') + `de opleiding “${LAB.naam}” heeft afgerond op ${datumNL(iso)}.`),
    h('dl',{class:'atData'}, ...rij(A.sectorLabel||'Pad', p.label), ...rij('Studieduur', A.duur), ...rij('Eindtoets', 'behaald'),
      ...rij('Attestnummer', nrOut), LIC.nummer ? rij('Licentie', LIC.nummer) : [], ...rij('Inhoudsversie', A.versie)),
    h('div',{class:'atKop'}, 'Behandelde onderwerpen'),
    h('ol',{class:'atOnd'}, SKILLS.map(s=>h('li',null,s))),
    h('p',{class:'atVoet'}, A.tekst));
  zet();
  const knoppen = h('div',{class:'actions'},
    h('button',{class:'btn', onclick:()=>printAttest(doc)}, 'Afdrukken of bewaren als pdf'),
    LAB.werkgever ? h('button',{class:'btn ghost', onclick:()=>{ renderCode(); toTop(); }}, 'Voortgangscode voor je werkgever') : null);
  return h('div',{class:'attestWrap'}, doc, h('div',{class:'atActies'}, naamVeld('Naam op het attest', zet), knoppen,
    h('p',{class:'certHint'}, 'Kies bij het afdrukken “Opslaan als pdf” om het attest te bewaren.')));
}
function printAttest(doc){
  if(!S.naam || !S.naam.trim()){ const i=document.querySelector('.atActies input'); if(i){ i.focus(); i.classList.add('leeg'); } return; }
  let box = document.getElementById('printAttest'); if(box) box.remove();
  box = h('div',{id:'printAttest'}, doc.cloneNode(true)); document.body.append(box);
  document.body.classList.add('printing');
  const weg = () => { document.body.classList.remove('printing'); box.remove(); window.removeEventListener('afterprint', weg); };
  window.addEventListener('afterprint', weg);
  try{ window.print(); }catch(e){}
  setTimeout(()=>{ if(!window.matchMedia('print').matches) weg(); }, 1500);
}
function voortgangsObject(){
  return {v:1, lab:LAB.slug, lic:LIC.nummer||'DEMO', org:LIC.organisatie||'', n:(S.naam||'').trim(), s:S.path, sl:PATHS[S.path].label,
    h:AREAS.map((a,i)=>halteDatum(i)), t:(S.toets&&S.toets[S.path]&&S.toets[S.path].ok)?1:0, a:allBuiltDone()?attestNummer():'', iv:(LAB.attest&&LAB.attest.versie)||''};
}
function maakVoortgangscode(){ return CODE.maak(voortgangsObject()); }
function renderCode(){
  setPath(S.path); app.className='wrap';
  const uit = h('div');
  const toon = () => {
    if(!S.naam || !S.naam.trim()){ uit.replaceChildren(h('p',{class:'certHint'}, 'Vul eerst je naam in.')); return; }
    const code = maakVoortgangscode();
    const ta = h('textarea',{class:'codeVak', readonly:true, rows:'4', 'aria-label':'Je voortgangscode'}); ta.value = code;
    const kop = h('button',{class:'btn', onclick:async()=>{ try{ await navigator.clipboard.writeText(code); kop.textContent='Gekopieerd ✓'; }catch(e){ ta.select(); kop.textContent='Selecteer en kopieer'; } }}, 'Kopieer de code');
    uit.replaceChildren(ta, h('div',{class:'actions'}, kop));
  };
  const o = voortgangsObject();
  const klaar = o.h.filter(Boolean).length;
  app.replaceChildren(
    h('div',{class:'lessonBar'}, h('button',{class:'x','aria-label':'Terug naar de kaart', onclick:()=>{ renderMap(); toTop(); }}, '✕'), h('div',{class:'kicker'},'Voortgangscode')),
    h('div',{class:'step', style:'margin-top:16px'},
      h('h2',null,'Voortgangscode voor je werkgever'),
      say(S.path, [`Met deze code ziet ${LIC.aanspreekpunt ? LIC.aanspreekpunt : 'je werkgever'} welke haltes je afrondde. Je hebt nu ${klaar} van de ${AREAS.length} haltes af${o.a ? ' en je attest' : ''}.`], {size:60}),
      h('div',{class:'card codeInfo'}, h('b',null,'Wat zit er in de code?'),
        h('ul',null, h('li',null,'je naam en je sector'), h('li',null,'welke haltes je afrondde, en wanneer'), h('li',null,'of je de eindtoets behaalde, en je attestnummer')),
        h('b',null,'Wat zit er niet in?'), h('p',null,'Je antwoorden, je scores per oefening en wat je zelf schreef. Die blijven op dit toestel.')),
      naamVeld('Je naam', toon), uit,
      h('p',{class:'certHint'}, 'Stuur de code via mail of het gewone interne kanaal naar ' + (LIC.aanspreekpunt||'je werkgever') + '.')));
  toon();
}

function renderSlot(){
  const {les,c,first} = cur, p = PATHS[S.path], d = doneFor(S.path);
  const wasFull = areaFull(les.area);
  d[les.id] = true;
  S.datum = S.datum||{}; S.datum[S.path] = S.datum[S.path]||{}; if(!S.datum[S.path][les.id]) S.datum[S.path][les.id] = vandaag();
  const scored = Object.values(first).filter(v=>v!==null);
  (S.score[S.path] = S.score[S.path]||{})[les.id] = scored.filter(Boolean).length+'/'+scored.length;
  save();
  const nowFull = areaFull(les.area);
  const rwVoor = (p.rewards||[p.reward])[les.area];
  const idx = L.indexOf(les), nxt = L[idx+1];
  const kids = [
    leesKnop(() => kaleTekst([c.slot, ...(nowFull && !wasFull && rwVoor ? [rwVoor.titel + '.', rwVoor.tekst] : [])].join(' '))),
    say(S.path, [c.slot], {size:84, mood:'happy'}),
    scored.length ? h('span',{class:'score'}, `${scored.filter(Boolean).length} van ${scored.length} oefeningen meteen juist`) : null
  ];
  const isLast = les.id===L[L.length-1].id;
  if(isLast){ S.klaar = S.klaar||{}; if(!S.klaar[S.path]) { S.klaar[S.path] = new Date().toISOString(); save(); } }
  const rw = (p.rewards||[p.reward])[les.area];
  if(nowFull && !wasFull && rw){
    kids.push(h('div',{class:'stamp'}, h('div',{class:'seal', html:rw.seal}), h('h3',null,rw.titel), h('p',null,rw.tekst)));
  }
  if(isLast) kids.push(LAB.attest ? attestCard() : certCard());
  kids.push(h('div',{class:'actions'},
    nxt ? h('button',{class:'btn', onclick:()=>openLesson(nxt.id)}, nxt.area!==les.area ? `Naar halte ${nxt.area+1}: ${AREAS[nxt.area].naam.toLowerCase()}` : `Volgende les: ${nxt.titel}`) : null,
    h('button',{class:'btn'+(nxt?' ghost':''), onclick:()=>{ selArea=currentArea(); renderMap(); toTop(); }}, 'Naar de kaart')));
  return h('div',{class:'step'}, h('h2',null,'Les voltooid'), ...kids);
}

render();
</script>
